[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "passerelle-host"
# This literal must equal the repository's VERSION file. It cannot be read from
# there: a published sdist contains only this directory, not the tree above it.
# tools/release/test_version_sync.py fails the build on any drift, and the
# release workflow's `install check` job compares `qshare --version` with the
# tag being released.
version = "0.1.0"
description = "Passerelle host tools: qshare, qrun, fsproof, pbench"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Passerelle Team"}
]
dependencies = []

[project.scripts]
qshare = "qshare.cli:main"
qrun = "qshare.qrun:main"
fsproof = "fsproof.cli:main"
pbench = "bench.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pgwutil*", "qshare*", "fsproof*", "bench*"]
