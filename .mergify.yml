# File de merge Mergify — socle CI self-hosted (R630).
#
# Mergify est le SEUL pilote de merge du dépôt. Le gate hermes-lite reste en
# dry-run (variable de dépôt HERMES_LITE_DRY_RUN=1) : il observe et alerte,
# il ne fusionne jamais.
#
# Les checks exigés sont ceux de la CI réelle du dépôt (.github/workflows/ci.yml)
# plus le garde-fou du socle (ci-budget). Les jobs qemu-e2e ne sont pas
# exigés : ils ne tournent jamais sur une pull request (workflow_dispatch +
# push sur main uniquement).
#
# Structure copiée du .mergify.yml de BaptisteFaisy/duello (décision
# user 2026-10-10) : inline labels urgent / priority-low identiques.
queue_rules:
  - name: default
    queue_conditions:
      # Budget CI 5 min (règle user 2026-10-24) : le garde-fou du socle.
      - check-success = ci-budget
      # CI réelle du dépôt : chaque job de .github/workflows/ci.yml.
      - check-success = build-test
      - check-success = sanitize
      - check-success = host-tools
      - check-success = qnx-syntax
      - check-success = rules
      - -conflict
      - -draft
      - base = main
    batch_size:
      min: 1
      max: 3
    batch_max_wait_time: "30 seconds"
    max_checks_retries: 1
    merge_method: rebase
    update_method: rebase

priority_rules:
  - name: urgent
    conditions:
      - label = urgent
    priority: high
  - name: priority-low
    conditions:
      - label = priority-low
    priority: low

merge_queue:
  # 4 workers self-hosted (R630, labels passerelle-worker) ; la speculation
  # Mergify reste bornee a 4, ajustable.
  max_parallel_checks: 4

# Auto-queue natif (produit Merge Queue) : évite de dépendre du produit
# « Workflow Automation » (pull_request_rules), constaté désactivé le 24/10.
merge_protections_settings:
  auto_merge_conditions: true
