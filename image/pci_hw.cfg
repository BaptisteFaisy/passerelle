#
# image/pci_hw.cfg - INTx routing fragment for the Passerelle virtio-9p device.
#
# What this file is: the value of PCI_HW_CONFIG_FILE for the PCI server of the
# guest (see image/passerelle.build, which starts pci-server). Drop it into
# /proc/boot of the image - the QNX 7.1 image of tests/qemu/qnx71/ reads
# /proc/boot/pci_hw.cfg - or merge its [interrupts] section into the file the
# image already ships. Format, pin and IRQ measured on that guest; the CI job
# .github/workflows/qnx71-guest.yml re-measures them on every run. Details and
# the caveat below: docs/qnx71-guest.md.
#
#   B0:D5:F0  = the virtio-9p device QEMU places on the options qshare emits
#               (vid/did 1af4/1009, "B000:D05:F00" in pci-tool)
#   A         = its interrupt pin (INTA#)
#   10        = the INTx line SeaBIOS wired it to ("IRQ 10, pin A" in QEMU's
#               `info pci`); it follows the QEMU command line, not the driver
#
# Caveat, measured: pci_hw-Intel_x86.so 2.4 of the QNX 7.1.0 image rejects a
# config-file IRQ below 16 ("HW config file IRQ %d for B%u:D%u:F%u is invalid.
# Must >= 16"), while QEMU only routes PCI INTx to GSI 0-15 (measured on both
# the `pc` and the `q35` machine). The record below therefore states the wiring
# the driver must expect, and the driver takes the MSI-X path - which the same
# guest is seen to allocate (vmxnet3: IRQ 256/257/258). See docs/qnx71-guest.md.
[interrupts]
B0:D5:F0    A    10
