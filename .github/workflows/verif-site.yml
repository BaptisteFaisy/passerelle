name: verif-site

# The website is generated from the Markdown and committed under docs/, and
# GitHub Pages serves it straight from the branch (path /docs): no Pages build,
# no dependency, no third-party tool. This workflow regenerates the site in a
# scratch directory and compares it with the committed one, so a pull request
# that edits the documentation but forgets to regenerate fails instead of
# shipping a stale website. The generator also fails on a link to a missing
# file, so broken internal links are caught here too.
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'codelab/**'
      - 'upstream/**'
      - 'README.md'
      - 'tools/site/**'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'codelab/**'
      - 'upstream/**'
      - 'README.md'
      - 'tools/site/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verif-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: site up to date
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Regenerate and compare with the committed site
        run: python3 tools/site/build_site.py --check