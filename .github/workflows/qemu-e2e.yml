name: qemu-e2e (hors PR)

# Long bench: full conformance run + QEMU boot + throughput measurements.
#
# This workflow NEVER runs on a pull request: it is triggered by
# `workflow_dispatch` or by a push on `main` only. The 5-minute budget of
# the PR pipeline does not apply here (see ~/Bureau/CI-BUDGET-5MIN.md,
# "sortir des PR"), but the timeout stays explicit and justified.
#
#   timeout-minutes: 30
#   -> 30 min : banc de conformite differential (1M operations) + boot QNX
#      sous QEMU + mesures de debit, hors PR (regle CI 5 min).
#
# The timeout is a ceiling, not a target: the steps below are individually
# bounded by `timeout`, and every step that finds its input missing prints
# an explicit notice (never a silent green).

on:
  workflow_dispatch:
    inputs:
      ops:
        description: 'Number of conformance operations (0 = default)'
        required: false
        default: '0'
      protos:
        description: 'Protocols of the guest share scenario (E5)'
        required: false
        default: 'virtiofs,9p'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: qemu-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_JOBS: 4
  PGW_MODULES: common;virtio;proto9p;protofuse;rmfs;drivers;tests
  # Ceiling of a single bench step, in seconds (the job timeout is 30 min).
  BENCH_STEP_TIMEOUT: 1500

jobs:
  # E5 needs QEMU and virtiofsd, which the R630 workers do not have. This job
  # therefore runs on a GitHub-hosted runner - free for a public repository -
  # and stays out of pull requests like the rest of this workflow. It boots a
  # minimal Linux guest under TCG (no nested KVM on hosted runners), which is
  # why its ceiling is higher than a pull-request job: 15 minutes, measured
  # around 2 minutes of real work (rule CI 5 min, long jobs stay out of PRs).
  e5-guest-share:
    name: e5-guest-share
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Start clock
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Checkout (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install QEMU, virtiofsd and the initramfs tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 virtiofsd cpio zstd
          qemu-system-x86_64 --version | head -1
          command -v virtiofsd || ls /usr/lib/qemu/virtiofsd /usr/libexec/virtiofsd
      - name: Kernel situation (diagnostic + readability)
        run: |
          set -uo pipefail
          # The harness boots the *host* kernel, so E5 needs a readable
          # /boot/vmlinuz-* with its /lib/modules tree. Runners often ship the
          # kernel 0600; making it world-readable costs nothing on an ephemeral
          # runner and turns a skip into a real test. The 9P client module lives
          # in linux-modules-extra on Ubuntu, hence the best-effort install.
          ls -l /boot/vmlinuz-* 2>/dev/null || echo "no /boot/vmlinuz-* at all"
          ls -d /lib/modules/* 2>/dev/null || echo "no /lib/modules/* at all"
          sudo chmod a+r /boot/vmlinuz-* 2>/dev/null || echo "chmod refused"
          sudo apt-get install -y --no-install-recommends \
            "linux-modules-extra-$(uname -r)" 2>/dev/null \
            || echo "linux-modules-extra not installable here"
          echo "--- after ---"
          ls -l /boot/vmlinuz-* 2>/dev/null | head -3
          ls /lib/modules/$(uname -r)/kernel/fs/9p/ /lib/modules/$(uname -r)/kernel/fs/fuse/ \
            2>/dev/null | head -8 || echo "no 9p/virtiofs modules for $(uname -r)"
      - name: Boot the guest on the qshare options (E5)
        run: |
          set -uo pipefail
          rc=0
          python3 tests/qemu/run_share_check.py \
            --protos "${{ github.event.inputs.protos || 'virtiofs,9p' }}" \
            --workload 30 || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::notice::E5 skipped on this runner: prerequisite missing"
          elif [ "$rc" -ne 0 ]; then
            echo "::error::E5 failed with code $rc"
            exit "$rc"
          fi
      - name: Report duration
        if: always()
        run: |
          echo "::notice::e5-guest-share: $(( $(date +%s) - JOB_START ))s (ceiling 900s)"

  qemu-e2e:
    name: qemu-e2e
    runs-on: [self-hosted, passerelle-worker]
    # 30 min : banc de conformite differential (1M operations) + boot QNX
    # sous QEMU + mesures de debit, hors PR (regle CI 5 min).
    timeout-minutes: 30
    steps:
      - name: Start clock
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Toolchain (cmake)
        run: |
          set -euo pipefail
          if ! command -v cmake >/dev/null 2>&1; then
            for d in "$HOME/ci-tools/cmake/cmake/data/bin" "$HOME/.local/cmake/data/bin"; do
              if [ -x "$d/cmake" ]; then
                export PATH="$d:$PATH"
                echo "$d" >> "$GITHUB_PATH"
                break
              fi
            done
          fi
          if ! command -v cmake >/dev/null 2>&1; then
            echo "::warning::cmake absent du runner - installation locale (reseau requise)"
            python3 -m pip install --quiet --disable-pip-version-check \
              --target "$GITHUB_WORKSPACE/.ci-tools/cmake" "cmake<4"
            export PATH="$GITHUB_WORKSPACE/.ci-tools/cmake/cmake/data/bin:$PATH"
            echo "$GITHUB_WORKSPACE/.ci-tools/cmake/cmake/data/bin" >> "$GITHUB_PATH"
          fi
          cmake --version
      - name: Clean workspace (keep the build trees)
        run: |
          set -euo pipefail
          if git rev-parse --git-dir >/dev/null 2>&1; then
            git clean -ffdx -e '/build' -e '/build-asan' -e '/.ci-tools'
          else
            echo "no previous checkout in this workspace - nothing to clean"
          fi
          for d in build build-asan; do
            if [ -f "$d/CMakeCache.txt" ]; then
              src=$(sed -n 's/^CMAKE_HOME_DIRECTORY:INTERNAL=//p' "$d/CMakeCache.txt")
              if [ -n "$src" ] && [ "$src" != "$PWD" ]; then
                echo "::warning::stale CMake cache in $d ($src) - recreated"
                cmake -E rm -rf "$d"
              fi
            fi
          done
      - name: Checkout (shallow, caches preserved)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: false
      - name: Build the portable stack
        run: |
          set -euo pipefail
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DPGW_MODULES="$PGW_MODULES"
          cmake --build build -j"$CMAKE_BUILD_JOBS"
      - name: Differential conformance bench (long campaign)
        run: |
          set -euo pipefail
          # The pull-request pipeline runs the short campaigns (seconds); here we
          # run the ones of spec 7.6: one million differential operations and
          # five million randomized inputs per decoder family. The environment
          # variables are how the benches take their size, so no command-line
          # convention is needed here either.
          export PGW_DIFF_OPS="${PGW_BENCH_OPS:-1000000}"
          export PGW_FUZZ_ITERS=5000000
          echo "differential: $PGW_DIFF_OPS operations per seed"
          timeout "$BENCH_STEP_TIMEOUT" ./build/tests/test_diff
          echo "fuzz: $PGW_FUZZ_ITERS iterations per decoder family"
          timeout "$BENCH_STEP_TIMEOUT" ./build/tests/fuzz_p9
          timeout "$BENCH_STEP_TIMEOUT" ./build/tests/fuzz_fuse
      - name: Guest share scenario (E5, Linux guest)
        run: |
          set -uo pipefail
          # Boots a minimal Linux guest on the options qshare emits and checks
          # both directions of the exchange. The harness exits 2 when a
          # prerequisite is missing (no QEMU, no virtiofsd, no readable kernel):
          # that is an explicit skip, reported as a notice - never a silent
          # green, and not a failure of the repository either.
          # The `|| rc=$?` form matters: Actions runs steps under `bash -e`, so
          # a bare failing command would abort the step before it is inspected.
          rc=0
          python3 tests/qemu/run_share_check.py \
            --protos "${{ github.event.inputs.protos || 'virtiofs,9p' }}" || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::notice::E5 skipped on this runner: prerequisite missing (QEMU, virtiofsd or a readable kernel)"
          elif [ "$rc" -ne 0 ]; then
            echo "::error::E5 failed with code $rc"
            exit "$rc"
          else
            echo "E5 passed on this runner"
          fi
      - name: QNX guest scenario (QEMU)
        run: |
          set -euo pipefail
          found=0
          for script in host/qshare/run-e2e.py host/qshare/e2e.py; do
            [ -f "$script" ] || continue
            found=1
            echo "--- $script"
            timeout "$BENCH_STEP_TIMEOUT" python3 "$script"
          done
          if [ "$found" -eq 0 ]; then
            echo "::notice::no QNX guest scenario script in the tree - scenario skipped (explicit skip, not a silent green): it needs the QNX SDP and an image built by mkqnximage"
          fi
      - name: Report duration
        if: always()
        run: |
          echo "::notice::qemu-e2e: $(( $(date +%s) - JOB_START ))s (ceiling 1800s)"
